
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng | Matty Matcha</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
    
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-container">

            <a href="index.html" class="logo">
                <img src="images/logo/logo1.jpg" alt="Matty Matcha">
                <span>Matty Matcha</span>
            </a>

            <div class="header-actions">

                <a href="tel:0907181552" class="hotline">
                    <span class="action-icon">☎</span>
                    <span>
                        Giao tận nơi
                        <strong>0907181552</strong>
                    </span>
                </a>

                <a href="menu.html" class="cart-button">
                    ← Tiếp tục mua hàng
                </a>

            </div>

        </div>
    </header>


    <!-- MAIN -->
    <main class="cart-page">

        <div class="section-heading">
            <h2>GIỎ HÀNG CỦA BẠN</h2>
            <p>Kiểm tra lại các món trước khi đặt hàng</p>
        </div>

        <div class="cart-layout">

            <!-- DANH SÁCH SẢN PHẨM -->
            <section class="cart-products">

                <div class="cart-products-header">
                    <h3>Sản phẩm đã chọn</h3>
                </div>

                <div id="cart-items">
                 
                </div>

            </section>


            <!-- TỔNG ĐƠN HÀNG -->
            <aside class="cart-summary">

                <h3>Tổng đơn hàng</h3>

                <div class="summary-row">
                    <span>Tạm tính</span>
                    <strong id="cart-subtotal">0đ</strong>
                </div>

                <div class="summary-row">
                    <span>Phí giao hàng</span>
                    <strong id="shipping-fee">Tính sau</strong>
                </div>

                <div class="summary-total">
                    <span>Tổng cộng</span>
                    <strong id="cart-total">0đ</strong>
                </div>

                

                <!--Form đặt hàng-->
                <div class="checkout-form">
                    <h3>Thông tin đặt hàng</h3>

                    <form id="checkout-form">

                        <div class="form-group">
                            <label for="customer-name">Họ và tên</label>
                            <input 
                                type="text" 
                                id="customer-name" 
                                name="name"
                                placeholder="Nhập họ tên"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="customer-phone">Số điện thoại</label>
                            <input 
                                type="tel" 
                                id="customer-phone" 
                                name="phone"
                                placeholder="Nhập số điện thoại"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="customer-address">Địa chỉ giao hàng</label>
                            <input 
                                type="text" 
                                id="customer-address" 
                                name="address"
                                placeholder="Nhập địa chỉ giao hàng"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="customer-note">Ghi chú</label>
                            <textarea 
                                id="customer-note" 
                                name="note"
                                placeholder="Ghi chú cho đơn hàng"
                            ></textarea>
                        </div>

                        <button type="submit" id="checkout-btn">
                            Đặt hàng
                        </button>

                    </form>

                    <div id="order-success" class="order-success" hidden>
                        Đặt hàng thành công!
                    </div>
                    
                </div>

            </aside>

        </div>

    </main>


    <script src="js/main.js" defer></script>
    <script src="js/cart.js" defer></script>

</body>
</html>
